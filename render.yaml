services:
  - type: web
    name: ingredientsight-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: PORT
        generateValue: false
